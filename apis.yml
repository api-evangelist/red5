- aid: red5:core-sdk
  name: Red5 Core SDK
  description: >-
    The Red5 Core SDK is a native client library for building real-time streaming applications on Linux,
    Windows, and macOS desktop platforms. It offers interfaces for server connection management, media
    capture and processing, audio and video source configuration, renderer control, and integration with
    Stream Manager for autoscaled deployments. Bindings are available for C++, Python, and other native
    environments.
  humanURL: https://www.red5.net/docs/red5-pro/development/sdks/red5-core-sdk/
  baseURL: https://api.example.com
  tags:
  - Desktop
  - Linux
  - Media
  - Native
  - SDK
  - Streaming
  - Windows
  properties:
  - type: Documentation
    url: https://www.red5.net/docs/red5-pro/development/sdks/red5-core-sdk/
  - type: SDKs
    url: https://www.red5.net/live-streaming-sdks/
- aid: red5:ios-sdk
  name: Red5 Pro iOS Streaming SDK
  description: >-
    The Red5 Pro iOS Streaming SDK is a native iOS library for integrating real-time live streaming publish
    and subscribe capabilities into iOS applications. It supports H.264 video and AAC/Opus audio encoding,
    WebRTC-based streaming with WHIP/WHEP, and integration with Stream Manager for cluster-aware streaming
    deployments. Example code and testbeds are available on GitHub.
  humanURL: https://www.red5.net/docs/red5-pro/development/sdks/
  baseURL: https://api.example.com
  tags:
  - iOS
  - Media
  - Mobile
  - SDK
  - Streaming
  - Swift
  properties:
