apis:
- aid: red5:webrtc-sdk
  name: Red5 Pro WebRTC SDK
  description: >-
    The Red5 Pro WebRTC SDK is a JavaScript library for integrating low-latency live streaming publish
    and subscribe capabilities into web applications. It supports WHIP for WebRTC publishing and WHEP
    for WebRTC playback, enabling sub-second latency streaming directly in the browser without plugins.
    The SDK provides APIs for managing stream sessions, configuring media constraints, handling connection
    lifecycle events, and interacting with Stream Manager for scalable deployments.
  humanURL: https://www.red5.net/docs/red5-pro/development/sdks/red5-webrtc-sdk/
  baseURL: https://api.example.com
  tags:
  - JavaScript
  - Media
  - SDK
  - Streaming
  - WebRTC
  - WHEP
  - WHIP
  properties:
  - type: Documentation
    url: https://www.red5.net/docs/red5-pro/development/sdks/red5-webrtc-sdk/
  - type: APIReference
