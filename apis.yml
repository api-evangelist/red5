    url: https://www.red5.net/docs/red5-pro/development/sdks/
  - type: GitHub
    url: https://github.com/red5pro/streaming-ios
- aid: red5:android-sdk
  name: Red5 Pro Android Streaming SDK
  description: >-
    The Red5 Pro Android Streaming SDK is a native Android library for integrating real-time live streaming
    publish and subscribe capabilities into Android applications. It supports H.264/H.265 video encoding,
    AAC audio, WebRTC-based streaming, and adaptive bitrate control. SDK examples and testbeds are available
    on GitHub for common streaming use cases.
  humanURL: https://www.red5.net/docs/red5-pro/development/sdks/
  baseURL: https://api.example.com
