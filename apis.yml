aid: red5
name: Red5
description: >-
  Red5 provides real-time streaming infrastructure for live video and audio delivery at scale. The Red5 Pro platform
  includes a media server, Stream Manager 2.0 for autoscaling cloud deployments, the Brew Mixer for composite stream
  production, a Restreamer for pushing live streams to social media and RTMP destinations, and WebRTC and native SDKs
  for browser and mobile integration. Red5 APIs enable programmatic management of streams, mixers, restreaming, cluster
  orchestration, and node monitoring. Use cases include live events, sports broadcasting, interactive video, gaming,
  surveillance, and enterprise communications requiring ultra-low latency streaming.
