scheme: semver
note: >-
  Red5 keeps two dated changelogs — one for the Red5 Pro Server (self-hosted software)
  and one for Red5 Cloud (the managed PaaS). Both are per-release pages with dates,
  grouped into New Features / Improvements / Bug Fixes. Neither marks breaking changes
  as such; the 15.0.0 SDK client removal and the 16.0.0 server release are only
  identifiable as breaking by reading the entries. Full history back to 13.0.0 is kept
  online, plus a separate known-issues page and a CVE archive.
