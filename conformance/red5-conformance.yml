domain_standard_summary:
  market: live video streaming and real-time media delivery
  note: >-
    Red5's contract declares its domain standards in the paths themselves — /proxy/whip
    and /proxy/whep are the IETF WHIP/WHEP ingest and egress endpoints, not bespoke
    vendor verbs, so a client that already speaks WHIP/WHEP integrates with no custom
    connector. RTMP/E-RTMP, HLS, SRT and now MoQ/CMAF are carried the same way.
