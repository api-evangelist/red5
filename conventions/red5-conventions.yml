  collections: '{ "data": [ ... ] }'
  singletons: bare resource object
path_conventions:
  slash_bearing_ids: >-
    Stream GUIDs contain a slash (`live/stream1`) and appear as path values. Red5's own
    Swagger UI documentation warns that percent-encoding that slash can be rejected by
    the deployment route or security firewall, and tells callers to use curl with the
    literal slash-bearing path instead.
  node_group_scoping: >-
    Every Stream Manager 2.0 stream operation is scoped by {nodeGroupName} — a client
    must know which node group it is publishing or subscribing against before it can
    build a URL.
events:
  webhooks: asyncapi/red5-webhooks-asyncapi.yml
  signaling: asyncapi/red5-webrtc-streaming-asyncapi.yml
deployment_shape:
  note: >-
    Red5 Pro is customer-deployed software, so there is no single vendor-operated API
    host. Every base URL is templated on the customer's own Stream Manager domain
    (https://{streamManagerDomain}/as/v1) or Red5 Pro server (http://{host}:5080). Red5
    Cloud is the managed variant and, per Red5's own docs, "uses the same APIs as Red5
    Pro". The live OpenAPI document is generated by the running instance and served at
    <stream-manager-host>/swagger-ui.html behind that instance's own login — it is not
    published at any Red5-operated URL.
