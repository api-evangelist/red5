  - from: StreamProvision
    to: StreamEndpoint
    type: has_one
    via: streamGuid
    evidence: Both are addressed by the same streamGuid within a node group.
  - from: Mixer
    to: MixerInput
    type: has_many
    via: mixerId
    evidence: '/brewmixer/2.0/mixers/{mixerId}/inputs'
  - from: ImageOverlay
    to: Mixer
    type: belongs_to
    via: mixerId
    evidence: ImageOverlay.mixerId
  - from: MixerInput
    to: StreamProvision
    type: references
    via: streamName
    confidence: medium
    evidence: >-
      MixerInput.streamName names a live stream by name; the contract does not declare a
      $ref between the Brew Mixer and Stream Manager surfaces, so this edge is by
      convention rather than by schema.
  - from: RtmpProvision
    to: RtmpDestination
    type: has_many
