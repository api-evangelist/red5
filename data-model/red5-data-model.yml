note: >-
  Derived from components.schemas plus the id-bearing path parameters. Red5's model is
  deployment-shaped, not tenant-shaped: the root is a NodeGroup (a cluster the customer
  provisions), everything below it is addressed by caller-chosen natural keys
  (streamGuid, streamName, nodeGroupName) rather than server-issued opaque ids, and
  there is no account/organization/customer entity anywhere in the REST contract —
  tenancy lives in the Red5 Cloud console, not in the API.
identifiers:
  - field: nodeGroupName
    kind: caller-chosen name
    scope: Stream Manager 2.0
  - field: streamGuid
    kind: slash-bearing path (e.g. live/stream1 — app name plus short stream id)
    scope: Stream Manager 2.0
    note: The Digest Token's `stream` field uses only the short id (stream1), not the full GUID.
  - field: streamName
    kind: caller-chosen name, scoped by appName
    scope: standalone Restreamer servlets
  - field: mixerId
    kind: server-issued id
    scope: Brew Mixer
  - field: inputId
    kind: server-issued id
    scope: Brew Mixer
  - field: imageId
    kind: server-issued id
    scope: Brew Mixer
entities:
