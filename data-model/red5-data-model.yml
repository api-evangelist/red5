    fields: [sourceUrl, streamKey, streamName, appName]
  - name: FileRestreamProvision
    schema: openapi/red5-file-restreamer-api-openapi.yml#/components/schemas/FileRestreamProvision
    key: streamName
    fields: [filePath, streamName, appName, loop]
