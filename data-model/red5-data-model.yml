  - name: StreamEndpoint
    schema: openapi/red5-streams-api-openapi.yml#/components/schemas/StreamEndpoint
    key: streamGuid
    fields: [host, port, protocol, streamGuid, app]
    description: >-
      The resolved node a client should publish to or subscribe from — the output of the
      Streams API's load-balancing decision, not a stored record.
  - name: Mixer
    schema: openapi/red5-mixers-api-openapi.yml#/components/schemas/Mixer
    key: id
    fields: [id, outputStreamName, outputWidth, outputHeight, outputFrameRate, outputBitrate, inputCount, status]
    description: A Brew Mixer session composing several inputs into one output stream.
  - name: MixerInput
    schema: openapi/red5-inputs-api-openapi.yml#/components/schemas/MixerInput
    key: id
    fields: [id, streamName, x, y, width, height, zOrder]
    description: One source stream placed in a mixer's render tree.
  - name: ImageOverlay
    schema: openapi/red5-images-api-openapi.yml#/components/schemas/ImageOverlay
    key: id
    fields: [id, mixerId, x, y, width, height, zOrder]
    description: A static image layer composited over a mixer output.
  - name: RtmpProvision
    schema: openapi/red5-rtmp-restreamer-api-openapi.yml#/components/schemas/RtmpProvision
