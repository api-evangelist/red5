    schema: openapi/red5-admin-api-openapi.yml#/components/schemas/NodeGroup
    key: name
    fields: [name, cloudProvider, region, minNodes, maxNodes, currentNodes, status]
    description: An autoscaling cluster of Red5 Pro nodes in one cloud region.
  - name: Node
    schema: openapi/red5-admin-api-openapi.yml#/components/schemas/Node
    key: id
    fields: [id, host, status, activeStreams, connectedClients, cpuLoad, memoryUsed]
    description: >-
      A single server instance in a node group, in one of the origin / edge / relay /
      transcoder / mixer / video-packager roles.
  - name: SystemInfo
    schema: openapi/red5-admin-api-openapi.yml#/components/schemas/SystemInfo
    key: null
    fields: [version, javaVersion, uptime, totalMemory, freeMemory]
    description: Singleton snapshot of the Stream Manager host itself.
  - name: StreamProvision
    schema: openapi/red5-provision-api-openapi.yml#/components/schemas/StreamProvision
    key: streamGuid
    fields: [streamGuid, username, password, recording, transcodeEnabled, transcodeLadder]
    description: >-
      The declared configuration of a stream before it is published — credentials,
      recording flag and optional ABR ladder.
  - name: TranscodeVariant
    schema: openapi/red5-provision-api-openapi.yml#/components/schemas/TranscodeVariant
    key: level
    fields: [level, videoWidth, videoHeight, videoBitrate, audioBitrate]
