    evidence: RtmpProvision.destinations is an array of RtmpDestination
gaps:
  - No account, organization, customer or project entity is exposed by the REST contract.
  - No cross-spec $ref — the Brew Mixer, Restreamer and Stream Manager schemas are independent component sets that repeat streamName/appName by convention.
  - No created/updated timestamps on any entity.
