notes: >-
  Red5 Pro pricing carries a published footnote — "additional fees may apply for
  services such as Castaway, custom SLAs, and custom developed features". Red5 Cloud
  bills two metered units (streaming GB and instance hours) plus PubNub transactions for
  the bundled chat/presence layer. The published SLA (99.9% availability, service
  credits) is at https://www.red5.net/legal/service-level-agreement/.
