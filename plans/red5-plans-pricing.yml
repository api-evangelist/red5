description: >-
  Red5 publishes public list pricing for both product lines. Red5 Pro (self-hosted
  server software) has four flat monthly tiers plus a per-project Mobile SDK licence.
  Red5 Cloud (managed PaaS) has a free-to-start usage tier, a committed Growth tier and
  a call-for-pricing Enterprise tier, each with published included quotas and published
  per-unit overage rates. The 2026-05-04 sweep recorded these as unavailable behind a
  403; refetched successfully 2026-09-04 with a browser User-Agent and replaced with the
  real published tiers.
