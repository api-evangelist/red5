description: >-
  Red5 publishes no API rate limit of any kind. Re-searched 2026-09-04 across the
  Stream Manager 2.0 API documentation, both pricing pages and all ten OpenAPI
  documents: there is no requests-per-window ceiling, no 429 response declared on any of
  the 26 operations, and no RateLimit-*, X-RateLimit-* or Retry-After header documented
  or returned in any declared response. The 2026-05-04 record said the site was
  unreachable (403); it is reachable now, and the honest answer is that the limits are
  genuinely absent rather than unfetched.
