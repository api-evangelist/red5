what_bounds_capacity:
  model: deployment-and-quota, not request-rate
  red5_pro: >-
    Self-hosted. Concurrency is bounded by the customer's own node count and licensed
    tier — Developer Pro caps at 100 connections with no clustering and no autoscale;
    Startup, Growth Pro and Enterprise are "unlimited connections" with autoscaling on
    AWS, Google Cloud, Azure or DigitalOcean.
  red5_cloud: >-
    Managed. Bounded by metered plan quotas rather than request rate — 50 GB streaming
    and 6,000 instance hours per month on the free Pay-As-You-Grow tier, 10,000 GB /
    10,000 instance hours on Growth, 20,000 GB / 10,000 instance hours on Enterprise,
    with published per-GB and per-instance-hour overage rates. Exceeding a quota bills
    an overage; it does not return an error status.
  cluster_controls: >-
    Stream Manager 2.0 NodeGroupConfig carries capacity and limit expressions (min() and
    max() added in server 16.0.0) and a max-publishers/max-subscribers example. Those are
    operator-configured admission controls on the customer's own cluster, not a
    provider-imposed API rate limit.
notes: >-
  An agent calling a Red5 deployment gets no runtime backpressure signal from the API.
  There is nothing to read on a response to decide whether to slow down, and no declared
  429 to catch. See conventions/red5-conventions.yml.
